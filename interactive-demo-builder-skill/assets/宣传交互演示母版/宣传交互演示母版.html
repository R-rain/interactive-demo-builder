<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品宣传交互演示</title>
<style>
:root{--brand:#067fc3;--brand-deep:#07568e;--accent:#f05b52;--mint:#10b99b;--ink:#17324d;--white:#fff;--surface:rgba(255,255,255,.96);--app-bg:linear-gradient(120deg,#10b99b,#067fc3 61%,#76b6e9);--app-orb:rgba(255,255,255,.11);--app-orb-deep:rgba(0,73,140,.12);--radius-sm:5px;--radius-md:7px;--radius-lg:13px;--shadow-card:0 10px 20px rgba(2,67,104,.16);--shadow-device:0 25px 34px rgba(4,55,98,.27);--font-sans:"PingFang SC","Microsoft YaHei",sans-serif;--font-display:"PingFang SC","Microsoft YaHei",sans-serif;--title-color:#fff}
*{box-sizing:border-box}body{margin:0;min-width:1024px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#eaf5fa;color:var(--ink)}button{font:inherit}.app{height:100vh;min-height:630px;overflow:hidden;position:relative;background:linear-gradient(120deg,var(--mint),var(--brand) 61%,#76b6e9)}.app:before,.app:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.app:before{width:54vw;height:54vw;right:-18vw;top:-31vw;background:rgba(255,255,255,.11)}.app:after{width:42vw;height:42vw;left:-22vw;bottom:-28vw;background:rgba(0,73,140,.12)}
.topbar{height:76px;padding:20px 36px;position:relative;z-index:5}.generic-logo{display:flex;align-items:center;gap:10px;color:#fff;font-size:16px;font-weight:600;letter-spacing:1px}.logo-mark{width:29px;height:29px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.logo-mark i{display:block;background:#fff}.logo-mark i:nth-child(2){opacity:.6}.logo-mark i:nth-child(3){opacity:.7}.logo-mark i:nth-child(4){background:var(--accent)}.view{height:calc(100vh - 76px);position:relative;z-index:1}
.overview{height:100%;position:relative}.overview-title{position:absolute;top:10%;left:50%;margin:0;transform:translateX(-50%);color:#fff;font-size:40px;letter-spacing:2px;white-space:nowrap}.overview-grid{position:absolute;top:51%;left:50%;width:min(87vw,1120px);height:430px;transform:translate(-50%,-50%)}.scene-node{position:absolute;z-index:2;width:164px;transform:translate(-50%,-50%);border:0;background:transparent;color:#fff;cursor:pointer;text-align:center;transition:.2s}.scene-node:hover{transform:translate(-50%,-50%) scale(1.07)}.node-icon{width:63px;height:63px;margin:auto;display:grid;place-items:center;border:2px solid rgba(255,255,255,.92);border-radius:50%;background:rgba(255,255,255,.11);box-shadow:0 0 0 8px rgba(255,255,255,.07)}.node-icon svg{width:29px;height:29px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.scene-node b{display:block;margin-top:12px;font-size:17px;white-space:nowrap}.hero-device{position:absolute;z-index:1;left:50%;top:69%;width:420px;height:258px;transform:translate(-50%,-50%);padding:9px 9px 15px;border-radius:13px 13px 4px 4px;background:#172a3a;box-shadow:0 25px 34px rgba(4,55,98,.27)}.device-base{position:absolute;left:50%;bottom:-25px;width:470px;height:25px;transform:translateX(-50%);border-radius:0 0 52% 52%;background:linear-gradient(#f7fafb,#aebbc5);box-shadow:0 5px 8px rgba(5,60,100,.16)}.device-base:before{content:"";position:absolute;left:50%;top:-10px;width:120px;height:16px;transform:translateX(-50%);border-radius:0 0 3px 3px;background:linear-gradient(90deg,#c4d0d7,#edf2f4,#c4d0d7)}.device-base:after{content:"";position:absolute;left:50%;top:3px;width:74px;height:4px;transform:translateX(-50%);border-radius:0 0 5px 5px;background:rgba(108,132,148,.35)}.template-screen{height:100%;border-radius:5px;background:linear-gradient(135deg,#eaf7fb,#d8eafb);padding:17px;overflow:hidden}.template-screen header{display:flex;gap:5px;height:17px}.template-screen header i{width:7px;height:7px;border-radius:50%;background:#8cc9d4}.template-screen main{display:grid;grid-template-columns:25% 1fr;gap:12px;margin-top:17px;height:190px}.template-nav,.template-work{border-radius:5px;background:#fff}.template-nav{padding:15px 11px}.template-nav i{display:block;height:8px;margin:11px 0;border-radius:8px;background:#e5edf2}.template-nav i:first-child{width:72%;background:#9de0d6}.template-work{padding:19px}.template-work b{font-size:16px;color:#35566f}.template-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.template-card{height:52px;border-radius:5px;background:#edf6f8}.template-line{height:8px;margin-top:18px;border-radius:8px;background:#e8eff2}.template-line.short{width:57%;background:#b8e6df}
.scene-intro{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 9% 7vh;text-align:center}.scene-intro h1{margin:0;color:#fff;font-size:54px;letter-spacing:2px}.scene-intro-copy{width:min(920px,84vw);margin-top:42px;padding-top:48px;position:relative}.scene-intro-copy:before{content:"";position:absolute;top:0;left:50%;width:46px;height:2px;transform:translateX(-50%);background:rgba(255,255,255,.9)}.scene-intro-copy p{margin:0;color:rgba(255,255,255,.96);font-size:27px;line-height:1.7;letter-spacing:.6px}
.feature-playback{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:center;padding:7vh 7vw}.feature-navigation h2{margin:0 0 35px;color:#fff;font-size:28px}.feature-list{display:grid;gap:12px}.feature-list button{position:relative;width:100%;border:0;background:transparent;padding:12px 18px;color:rgba(255,255,255,.7);font-size:18px;text-align:left;cursor:pointer;white-space:nowrap}.feature-list button:hover{color:#fff}.feature-list button.active{color:#356f88;background:#fff;box-shadow:0 10px 20px rgba(2,67,104,.16)}.feature-list button.active:before{content:"";position:absolute;left:-17px;top:50%;transform:translateY(-50%);border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:12px solid #fff}.media-stage{height:min(68vh,610px);aspect-ratio:16/9;background:#f8fcfe;box-shadow:0 20px 38px rgba(6,59,99,.22);overflow:hidden}.media-stage video{width:100%;height:100%;object-fit:contain;background:#10263a}.video-placeholder{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#f7fcff,#e3f1f7)}.video-placeholder>div{width:72%;padding:26px;border-radius:7px;background:#fff;box-shadow:0 12px 26px rgba(18,69,103,.1)}.video-placeholder b{display:block;color:var(--brand-deep);font-size:24px}.video-placeholder p{margin:10px 0 0;color:#7890a0;font-size:15px;line-height:1.7}
</style>
<style>
body{font-family:var(--font-sans)}
.app{background:var(--app-bg)}.app:before{background:var(--app-orb)}.app:after{background:var(--app-orb-deep)}
.overview-title{color:var(--title-color);font-family:var(--font-display)}
.hero-device{border-radius:var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-sm);box-shadow:var(--shadow-device)}
.feature-list button.active{color:var(--brand-deep);box-shadow:var(--shadow-card);border-radius:var(--radius-md)}
.media-stage{box-shadow:var(--shadow-device);border-radius:var(--radius-md)}
.video-placeholder{background:var(--surface)}.video-placeholder>div{border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="generic-logo"><span class="logo-mark"><i></i><i></i><i></i><i></i></span><span>品牌标识</span></div></header>
  <main class="view" id="view"></main>
</div>
<script>
// Replace the following generic configuration for each project.
const theme='original-template';
const themePresets={
  'original-template':{'--brand':'#067fc3','--brand-deep':'#07568e','--accent':'#f05b52','--mint':'#10b99b','--app-bg':'linear-gradient(120deg,#10b99b,#067fc3 61%,#76b6e9)','--app-orb':'rgba(255,255,255,.11)','--app-orb-deep':'rgba(0,73,140,.12)','--radius-md':'7px','--radius-lg':'13px','--shadow-card':'0 10px 20px rgba(2,67,104,.16)','--shadow-device':'0 25px 34px rgba(4,55,98,.27)','--font-display':'"PingFang SC","Microsoft YaHei",sans-serif','--title-color':'#fff'},
  'saas-indigo':{'--brand':'#4f46e5','--brand-deep':'#312e81','--accent':'#818cf8','--mint':'#6366f1','--app-bg':'linear-gradient(130deg,#312e81,#4f46e5 55%,#818cf8)','--app-orb':'rgba(255,255,255,.1)','--app-orb-deep':'rgba(17,24,39,.16)','--radius-md':'8px','--radius-lg':'14px','--shadow-card':'0 10px 20px rgba(49,46,129,.18)','--shadow-device':'0 25px 34px rgba(30,27,75,.3)','--font-display':'"PingFang SC","Microsoft YaHei",sans-serif','--title-color':'#fff'},
  'swiss-signal':{'--brand':'#101010','--brand-deep':'#101010','--accent':'#ff5a36','--mint':'#facc15','--app-bg':'linear-gradient(120deg,#facc15,#ffdb4d)','--app-orb':'rgba(255,255,255,.2)','--app-orb-deep':'rgba(16,16,16,.08)','--radius-md':'0px','--radius-lg':'0px','--shadow-card':'8px 8px 0 #ff5a36','--shadow-device':'10px 10px 0 #ff5a36','--font-display':'Arial,Helvetica,sans-serif','--title-color':'#101010'},
  'aurora-tech':{'--brand':'#b89cff','--brand-deep':'#24205a','--accent':'#c6f7e8','--mint':'#6a3d82','--app-bg':'linear-gradient(125deg,#080821,#24205a 54%,#6a3d82)','--app-orb':'rgba(198,247,232,.1)','--app-orb-deep':'rgba(8,8,33,.25)','--radius-md':'12px','--radius-lg':'18px','--shadow-card':'0 0 24px rgba(184,156,255,.22)','--shadow-device':'0 0 28px rgba(184,156,255,.25)','--font-display':'"PingFang SC","Microsoft YaHei",sans-serif','--title-color':'#fff'},
  'editorial-warm':{'--brand':'#d96c4f','--brand-deep':'#6b5842','--accent':'#d6a85c','--mint':'#eecb91','--app-bg':'linear-gradient(130deg,#d6a85c,#f4e9da 60%,#d96c4f)','--app-orb':'rgba(255,255,255,.2)','--app-orb-deep':'rgba(107,88,66,.1)','--radius-md':'3px','--radius-lg':'3px','--shadow-card':'0 10px 22px rgba(107,88,66,.18)','--shadow-device':'0 16px 24px rgba(80,47,21,.25)','--font-display':'Georgia,"Songti SC",serif','--title-color':'#2d2924'},
  'deep-ops':{'--brand':'#20c7b2','--brand-deep':'#0b1f2a','--accent':'#ff9f43','--mint':'#123b4a','--app-bg':'linear-gradient(135deg,#0b1f2a,#123b4a 58%,#1aa58f)','--app-orb':'rgba(104,215,198,.1)','--app-orb-deep':'rgba(3,12,18,.22)','--radius-md':'4px','--radius-lg':'6px','--shadow-card':'0 8px 0 rgba(3,12,18,.25)','--shadow-device':'0 12px 20px rgba(3,12,18,.35)','--font-display':'"PingFang SC","Microsoft YaHei",sans-serif','--title-color':'#e6fffb'},
  'cloud-minimal':{'--brand':'#3b82f6','--brand-deep':'#1d4ed8','--accent':'#60a5fa','--mint':'#93c5fd','--app-bg':'linear-gradient(145deg,#f8fbff,#e7f0fb)','--app-orb':'rgba(59,130,246,.08)','--app-orb-deep':'rgba(44,85,130,.06)','--radius-md':'8px','--radius-lg':'10px','--shadow-card':'0 10px 22px rgba(44,85,130,.12)','--shadow-device':'0 10px 20px rgba(44,85,130,.15)','--font-display':'"PingFang SC","Microsoft YaHei",sans-serif','--title-color':'#23334d'},
  'blueprint':{'--brand':'#56b8ed','--brand-deep':'#083b66','--accent':'#ff9f43','--mint':'#0b4d78','--app-bg':'linear-gradient(135deg,#08233d,#0b4d78 58%,#0d6b93)','--app-orb':'rgba(158,216,255,.1)','--app-orb-deep':'rgba(6,27,46,.22)','--radius-md':'2px','--radius-lg':'2px','--shadow-card':'0 0 0 1px #56b8ed','--shadow-device':'0 8px 0 rgba(6,27,46,.35)','--font-display':'ui-monospace,monospace','--title-color':'#e9f6ff'}
};
function applyTheme(name){const key=themePresets[name]?name:'original-template';const vars=themePresets[key];Object.entries(vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));document.documentElement.dataset.theme=key;}
applyTheme(theme);
const scenes=[
  {id:'scene-a',name:'场景一',summary:'聚焦核心业务价值，建立统一、清晰、可追溯的管理基础。'},
  {id:'scene-b',name:'场景二',summary:'以关键业务数据为依据，形成过程可控的闭环管理。'},
  {id:'scene-c',name:'场景三',summary:'围绕业务执行全周期，提升协同效率和数据可信度。'},
  {id:'scene-d',name:'场景四',summary:'通过规则和数据分析，将风险识别前置并持续跟踪。'}
];
const units=[
  {id:'scene-a',sceneId:'scene-a',name:'场景一',summary:'聚焦核心业务价值，建立统一、清晰、可追溯的管理基础。',intro:5,features:[
    {id:'a-1',name:'功能一',seconds:10,benefit:'展示关键能力带来的管理价值。'},
    {id:'a-2',name:'功能二',seconds:10,benefit:'展示关键能力带来的管理价值。'}]},
  {id:'scene-b',sceneId:'scene-b',name:'场景二',summary:'以关键业务数据为依据，形成过程可控的闭环管理。',intro:5,features:[
    {id:'b-1',name:'功能一',seconds:10,benefit:'展示关键能力带来的管理价值。'},
    {id:'b-2',name:'功能二',seconds:10,benefit:'展示关键能力带来的管理价值。'}]},
  {id:'scene-c',sceneId:'scene-c',name:'场景三',summary:'围绕业务执行全周期，提升协同效率和数据可信度。',intro:5,features:[
    {id:'c-1',name:'功能一',seconds:10,benefit:'展示关键能力带来的管理价值。'}]},
  {id:'scene-d',sceneId:'scene-d',name:'场景四',summary:'通过规则和数据分析，将风险识别前置并持续跟踪。',intro:5,features:[
    {id:'d-1',name:'功能一',seconds:10,benefit:'展示关键能力带来的管理价值。'}]}
];
const state={view:'overview',unitId:'scene-a',featureId:'a-1',auto:false,timer:null};
const positions=[[16,18],[39,18],[61,18],[84,18]];
const el=id=>document.getElementById(id);const unit=()=>units.find(item=>item.id===state.unitId);const feature=()=>unit().features.find(item=>item.id===state.featureId);
function iconSvg(index){const icons=['<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.7-4 3.1-6 7-6s6.3 2 7 6"/></svg>','<svg viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v4h4M10 12h5M10 16h5"/></svg>','<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c.7-4 3-6 6-6s5.3 2 6 6"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7z"/><path d="M12 8v5M12 17h.01"/></svg>'];return icons[index]}
function stopAuto(){state.auto=false;clearTimeout(state.timer)}
function openValue(id,keepAuto=false){if(!keepAuto)stopAuto();const current=units.find(item=>item.id===id)||units.find(item=>item.sceneId===id);state.unitId=current.id;state.featureId=current.features[0].id;state.view='value';render();if(state.auto)scheduleNext()}
function openFeature(unitId,featureId,keepAuto=false){if(!keepAuto)stopAuto();state.unitId=unitId;state.featureId=featureId;state.view='feature';render();if(state.auto)scheduleNext()}
function renderOverview(){return `<section class="overview"><h1 class="overview-title">产品名称</h1><div class="overview-grid">${scenes.map((item,index)=>`<button class="scene-node" style="left:${positions[index][0]}%;top:${positions[index][1]}%" onclick="openValue('${item.id}')"><span class="node-icon">${iconSvg(index)}</span><b>${item.name}</b></button>`).join('')}<div class="hero-device"><div class="template-screen"><header><i></i><i></i><i></i></header><main><aside class="template-nav"><i></i><i></i><i></i><i></i></aside><section class="template-work"><b>系统演示首页</b><div class="template-cards"><i class="template-card"></i><i class="template-card"></i><i class="template-card"></i></div><div class="template-line"></div><div class="template-line short"></div></section></main></div><div class="device-base"></div></div></div></section>`}
function renderValue(){return `<section class="scene-intro"><h1>${unit().name}</h1><div class="scene-intro-copy"><p>${unit().summary}</p></div></section>`}
function renderFeature(){const active=feature();const media=active.video?`<video id="featureVideo" autoplay src="${active.video}" onended="videoEnded()"></video>`:`<div class="video-placeholder"><div><b>${active.name}</b><p>视频素材待接入</p></div></div>`;return `<section class="feature-playback"><aside class="feature-navigation"><h2>${unit().name}</h2><div class="feature-list">${unit().features.map(item=>`<button class="${item.id===active.id?'active':''}" onclick="openFeature('${unit().id}','${item.id}')">${item.name}</button>`).join('')}</div></aside><div class="media-stage">${media}</div></section>`}
function render(){const target=el('view');target.innerHTML=state.view==='overview'?renderOverview():state.view==='value'?renderValue():renderFeature()}
function nextStep(){if(state.view==='overview'){openValue(units[0].id,state.auto);return}if(state.view==='value'){openFeature(unit().id,unit().features[0].id,state.auto);return}const index=unit().features.findIndex(item=>item.id===state.featureId);if(index<unit().features.length-1){openFeature(unit().id,unit().features[index+1].id,state.auto);return}const next=units[units.indexOf(unit())+1];if(next)openValue(next.id,state.auto);else stopAuto()}
function previousStep(){if(state.view==='overview')return;if(state.view==='value'){const i=units.indexOf(unit());if(i===0){state.view='overview';render()}else{const prev=units[i-1];openFeature(prev.id,prev.features[prev.features.length-1].id)}return}const i=unit().features.findIndex(item=>item.id===state.featureId);if(i>0)openFeature(unit().id,unit().features[i-1].id);else openValue(unit().id)}
function scheduleNext(){clearTimeout(state.timer);if(!state.auto)return;if(state.view==='overview'){state.timer=setTimeout(nextStep,5000);return}if(state.view==='value'){state.timer=setTimeout(nextStep,unit().intro*1000);return}if(!feature().video)state.timer=setTimeout(nextStep,feature().seconds*1000)}
function startAuto(){stopAuto();state.auto=true;state.view='overview';render();scheduleNext()}function videoEnded(){if(state.auto)nextStep()}
document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){event.preventDefault();stopAuto();nextStep()}if(event.key==='ArrowDown'){event.preventDefault();startAuto()}if(event.key==='ArrowLeft'){event.preventDefault();stopAuto();previousStep()}if(event.key==='Escape'){event.preventDefault();stopAuto()}});window.openValue=openValue;window.openFeature=openFeature;window.videoEnded=videoEnded;render();
</script>
</body>
</html>
